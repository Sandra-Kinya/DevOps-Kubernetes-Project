apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "demo-app.fullname" . }}
  labels:
    release: monitoring
spec:

  namespaceSelector:
    matchNames:
      - default
      - uat

  selector:
    matchLabels:
      app: {{ include "demo-app.name" . }}

  endpoints:
  - port: http
    path: /metrics
    interval: 5s
