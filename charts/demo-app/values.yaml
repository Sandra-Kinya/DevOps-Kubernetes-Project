replicaCount: 1

image:
  repository: sandrakinya/demo-app
  tag: v.1.0
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8085

config:
  appGreeting: "Hello from Kubernetes + Helm!"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

ingress:
  host: demo.local
  
environment: dev

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

probes:
  liveness:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /
    initialDelaySeconds: 3
    periodSeconds: 5
